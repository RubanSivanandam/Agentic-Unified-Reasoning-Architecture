<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AURA — Agentic Unified Reasoning Architecture">
  <defs>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#56b6c2;#7aa2f7" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#bb9af7">
        <animate attributeName="stop-color" values="#bb9af7;#56b6c2;#7aa2f7;#bb9af7" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#56b6c2">
        <animate attributeName="stop-color" values="#56b6c2;#7aa2f7;#bb9af7;#56b6c2" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="aur1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56b6c2" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#56b6c2" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", "JetBrains Mono", Menlo, monospace; }
      .fadein  { opacity: 0; animation: fi 1.2s ease-out forwards; }
      .fadein2 { opacity: 0; animation: fi 1.2s ease-out 0.5s forwards; }
      .fadein3 { opacity: 0; animation: fi 1.2s ease-out 1.0s forwards; }
      @keyframes fi { to { opacity: 1; } }
      .pulse  { animation: pu 3.2s ease-in-out infinite; }
      .pulse2 { animation: pu 3.2s ease-in-out 1.1s infinite; }
      .pulse3 { animation: pu 3.2s ease-in-out 2.2s infinite; }
      @keyframes pu { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      .flow { stroke-dasharray: 4 8; animation: fl 2.6s linear infinite; }
      @keyframes fl { to { stroke-dashoffset: -48; } }
    </style>
  </defs>

  <!-- backdrop -->
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="#0d1117" stroke="#21262d"/>

  <!-- drifting aurora fields -->
  <ellipse cx="220" cy="90" rx="260" ry="110" fill="url(#aur1)">
    <animate attributeName="cx" values="220;340;220" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="640" cy="210" rx="300" ry="120" fill="url(#aur2)">
    <animate attributeName="cx" values="640;520;640" dur="17s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1010" cy="80" rx="260" ry="110" fill="url(#aur3)">
    <animate attributeName="cy" values="80;150;80" dur="15s" repeatCount="indefinite"/>
  </ellipse>

  <!-- agent constellation, left -->
  <g stroke="#30363d" stroke-width="1">
    <line x1="96" y1="86" x2="170" y2="138" class="flow" stroke="#7aa2f7" stroke-opacity="0.55"/>
    <line x1="170" y1="138" x2="106" y2="196" class="flow" stroke="#bb9af7" stroke-opacity="0.55"/>
    <line x1="170" y1="138" x2="238" y2="98" class="flow" stroke="#56b6c2" stroke-opacity="0.55"/>
    <line x1="170" y1="138" x2="244" y2="190" class="flow" stroke="#7aa2f7" stroke-opacity="0.4"/>
  </g>
  <circle cx="96"  cy="86"  r="5" fill="#7aa2f7" class="pulse"/>
  <circle cx="170" cy="138" r="7" fill="#bb9af7" class="pulse2"/>
  <circle cx="106" cy="196" r="5" fill="#56b6c2" class="pulse3"/>
  <circle cx="238" cy="98"  r="4" fill="#56b6c2" class="pulse2"/>
  <circle cx="244" cy="190" r="4" fill="#7aa2f7" class="pulse"/>

  <!-- agent constellation, right (mirrored) -->
  <g stroke="#30363d" stroke-width="1">
    <line x1="1104" y1="86" x2="1030" y2="138" class="flow" stroke="#56b6c2" stroke-opacity="0.55"/>
    <line x1="1030" y1="138" x2="1094" y2="196" class="flow" stroke="#bb9af7" stroke-opacity="0.55"/>
    <line x1="1030" y1="138" x2="962"  y2="98"  class="flow" stroke="#7aa2f7" stroke-opacity="0.55"/>
    <line x1="1030" y1="138" x2="956"  y2="190" class="flow" stroke="#56b6c2" stroke-opacity="0.4"/>
  </g>
  <circle cx="1104" cy="86"  r="5" fill="#56b6c2" class="pulse2"/>
  <circle cx="1030" cy="138" r="7" fill="#bb9af7" class="pulse"/>
  <circle cx="1094" cy="196" r="5" fill="#7aa2f7" class="pulse3"/>
  <circle cx="962"  cy="98"  r="4" fill="#7aa2f7" class="pulse3"/>
  <circle cx="956"  cy="190" r="4" fill="#56b6c2" class="pulse2"/>

  <!-- wordmark -->
  <g class="fadein">
    <text x="600" y="128" text-anchor="middle" class="sans" font-size="88" font-weight="800"
          letter-spacing="26" fill="url(#title)">AURA</text>
  </g>
  <g class="fadein2">
    <text x="600" y="172" text-anchor="middle" class="sans" font-size="19" font-weight="600"
          letter-spacing="6" fill="#8b949e">AGENTIC UNIFIED REASONING ARCHITECTURE</text>
  </g>
  <g class="fadein3">
    <line x1="420" y1="196" x2="780" y2="196" stroke="#30363d" stroke-width="1"/>
    <text x="600" y="228" text-anchor="middle" class="mono" font-size="15" fill="#56b6c2">
      self-hosted&#160;&#160;&#183;&#160;&#160;CPU-only&#160;&#160;&#183;&#160;&#160;bring-your-own-key&#160;&#160;&#183;&#160;&#160;every decision traced&#160;&#160;&#183;&#160;&#160;every claim measured
    </text>
  </g>
</svg>
