<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AURA at a glance: 149 gated sprints, 18 waves, 1293+ keyless tests, 4 benchmark suites, 0 GPUs required">
  <defs>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#56b6c2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="num" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#56b6c2;#7aa2f7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#56b6c2">
        <animate attributeName="stop-color" values="#56b6c2;#7aa2f7;#bb9af7;#56b6c2" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", "JetBrains Mono", Menlo, monospace; }
      .big  { font-size: 40px; font-weight: 800; fill: url(#num); }
      .lbl  { font-size: 14px; fill: #8b949e; letter-spacing: 0.5px; }
      .card { opacity: 0; animation: rise 0.7s ease-out forwards; }
      .c1 { animation-delay: 0.05s; } .c2 { animation-delay: 0.20s; }
      .c3 { animation-delay: 0.35s; } .c4 { animation-delay: 0.50s; }
      .c5 { animation-delay: 0.65s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { .card { opacity: 1; animation: none; } }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="150" rx="16" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="150" rx="16" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- sweeping shimmer highlight -->
  <rect x="-400" y="0" width="400" height="150" fill="url(#sweep)" opacity="0.5">
    <animate attributeName="x" values="-400;1200" dur="6s" begin="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- 5 stat cards -->
  <g class="card c1">
    <text x="120" y="78" text-anchor="middle" class="sans big">149</text>
    <text x="120" y="104" text-anchor="middle" class="sans lbl">gated sprints</text>
  </g>
  <line x1="240" y1="40" x2="240" y2="110" stroke="#21262d" stroke-width="1"/>

  <g class="card c2">
    <text x="360" y="78" text-anchor="middle" class="sans big">18</text>
    <text x="360" y="104" text-anchor="middle" class="sans lbl">waves shipped</text>
  </g>
  <line x1="480" y1="40" x2="480" y2="110" stroke="#21262d" stroke-width="1"/>

  <g class="card c3">
    <text x="600" y="78" text-anchor="middle" class="sans big">1293+</text>
    <text x="600" y="104" text-anchor="middle" class="sans lbl">keyless tests</text>
  </g>
  <line x1="720" y1="40" x2="720" y2="110" stroke="#21262d" stroke-width="1"/>

  <g class="card c4">
    <text x="840" y="78" text-anchor="middle" class="sans big">4</text>
    <text x="840" y="104" text-anchor="middle" class="sans lbl">benchmark suites</text>
  </g>
  <line x1="960" y1="40" x2="960" y2="110" stroke="#21262d" stroke-width="1"/>

  <g class="card c5">
    <text x="1080" y="78" text-anchor="middle" class="sans big">0</text>
    <text x="1080" y="104" text-anchor="middle" class="sans lbl">GPUs required</text>
  </g>

  <!-- pulsing "live" dot -->
  <circle cx="26" cy="26" r="5" fill="#9ece6a">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="30" class="mono" font-size="12" fill="#8b949e">v2.6.0 · CPU-only · BYOK</text>
</svg>
