<svg width="1000" height="46" viewBox="0 0 1000 46" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AURA rotating tagline">
  <defs>
    <style>
      .mono { font-family: Consolas, "SF Mono", "JetBrains Mono", Menlo, monospace; font-size: 17px; }
      .line { opacity: 0; animation: cyc 15s linear infinite; }
      .l2 { animation-delay: 5s; }
      .l3 { animation-delay: 10s; }
      @keyframes cyc {
        0%    { opacity: 0; }
        2.5%  { opacity: 1; }
        30%   { opacity: 1; }
        33.3% { opacity: 0; }
        100%  { opacity: 0; }
      }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>
  <text x="500" y="29" text-anchor="middle" class="mono line" fill="#7aa2f7">point it at your data&#160;&#160;&#8594;&#160;&#160;it works out what everything means, on its own</text>
  <text x="500" y="29" text-anchor="middle" class="mono line l2" fill="#bb9af7">ask a question in plain English&#160;&#160;&#8594;&#160;&#160;then watch exactly how it reached the answer</text>
  <text x="500" y="29" text-anchor="middle" class="mono line l3" fill="#56b6c2">runs on your own laptop or server&#160;&#160;&#8594;&#160;&#160;no graphics card, and your data never leaves</text>
  <rect x="978" y="16" width="9" height="18" fill="#56b6c2" class="caret"/>
</svg>
